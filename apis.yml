x-discovery:
  date: '2026-08-04'
  result: no-public-api-surface
  probed:
  - 'REST OpenAPI/Swagger on immunai.com, www.immunai.com and fourteen candidate API/docs
    subdomains (/openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs,
    /docs, /redoc): 404 on every resolving host, NXDOMAIN on the rest'
  - 'GraphQL: no /graphql surface on any resolving host'
  - 'MCP: no public server. www.immunai.com/wp-json exposes a WordPress mcp-adapter
    namespace (/wp-json/mcp/mcp-adapter-default-server, /wp-json/mcp/mcp-oauth-server)
    but tools/list returns HTTP 401 rest_forbidden / mcp_unauthorized, and
    /wp-json/wp-abilities/v1/abilities returns 401 — CMS-admin plugin tooling, not a
    product MCP server'
  - 'A2A: /.well-known/agent-card.json and /.well-known/agent.json both 404 on every
    reachable host'
  - 'Packages: no first-party library on npm, PyPI, RubyGems or Packagist; no
    github.com/immunai org (404)'
  - 'llms.txt: 404 on www.immunai.com'
  - 'api.immunai.com and app.immunai.com DO resolve (34.110.128.250 and 34.144.219.193,
    both Google Cloud) but neither serves Immunai — the first resets the TLS handshake
    before presenting a certificate, the second presents a certificate for the unrelated
    domain *.asa.com.br and then returns 403. Recorded as dangling DNS records in
    security/immunai-domain-security.yml, not as API hosts'
  - 'Acquired properties nebion.com and genevestigator.com still resolve (95.216.38.13)
    but no HTTP or HTTPS service answers — offline, not deregistered'
  - 'The only public machine-readable surface is the marketing site''s stock WordPress
    REST API at www.immunai.com/wp-json — incidental CMS infrastructure, deliberately
    not registered as an Immunai API'
  - 'Security/compliance: no security.txt, no vulnerability disclosure policy, no trust
    center, no published certification. The privacy policy names GDPR/CPRA/Israeli
    PPL/Swiss FADP and claims Data Privacy Framework participation — captured in
    conformance/immunai-conformance.yml'
