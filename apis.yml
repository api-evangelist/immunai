aid: immunai
name: Immunai
description: 'Immunai is a New York-headquartered biotechnology company, founded in
  December 2018, that maps the human immune system at single-cell resolution and applies
  machine learning to drug discovery and development. Its central asset is AMICA (Annotated
  Multiomic Immune Cell Atlas), a cell-level immune knowledge base built from single-cell
  multiomics — RNA transcriptome, surface proteome, TCR/BCR repertoire and spatial
  transcriptomics — harmonized across thousands of public and proprietary studies covering
  hundreds of diseases and immune cell types, paired with an ImmunoDynamics Engine
  used for target discovery, preclinical evaluation and clinical trial optimization.
  Immunai works through partnerships with biopharmaceutical companies and research
  institutions rather than a self-serve product, and as of this profile it publishes
  no public developer portal, API documentation, machine-readable specification or
  SDKs. Offices are in New York, Tel Aviv, Prague and Zurich; the company acquired
  Dropprint Genomics (2021) and Nebion (2021).'
