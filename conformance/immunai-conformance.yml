  evidence: No OpenAPI or Swagger document is published on any Immunai host (see x-discovery in apis.yml).
- id: asyncapi
  conforms: false
  applicable: false
  evidence: No event, streaming or webhook surface is published.
- id: graphql
  conforms: false
