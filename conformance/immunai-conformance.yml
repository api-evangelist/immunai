summary: >-
  Immunai publishes no API, so every API-level and cross-cutting web-API standard below
  is not applicable rather than failed — there is no contract to conform to. What
  Immunai does publish is a substantive, dated data-protection posture in its privacy
  policy, which names the regulatory regimes it operates under and the officers
  accountable for them. Those are recorded here as first-party claims with the page
  they were read from.
