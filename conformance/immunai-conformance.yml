- id: rfc9116-security-txt
  conforms: false
  applicable: true
  evidence: >-
    /.well-known/security.txt returns 404 on www.immunai.com and immunai.com. A security
    reporting address does exist in DNS as a CAA iodef record
    (mailto:security@immunai.com), but that is scoped to certificate misissuance and is
    not a security.txt or a vulnerability disclosure policy.
- id: a2a
  conforms: false
  applicable: false
  evidence: /.well-known/agent-card.json and /.well-known/agent.json return 404 on every reachable host.
- id: mcp
  conforms: false
  applicable: false
  evidence: >-
    The only MCP surface reachable is the marketing site's WordPress mcp-adapter plugin
    at www.immunai.com/wp-json/mcp/*, which returns HTTP 401 to tools/list. That is CMS
    administration tooling shipped by a plugin, not a product MCP server.
- id: fhir
  conforms: false
  applicable: false
  evidence: >-
    Immunai works in single-cell multiomics and drug development, not clinical data
    exchange, and publishes no health-data interface.
