  evidence: Israeli Protection of Privacy Law named in the privacy policy (Immunai has a Tel Aviv office).
- id: swiss-fadp
  claimed: true
  evidence: Swiss Federal Act on Data Protection named in the privacy policy (Immunai has a Zurich office).
- id: eu-us-data-privacy-framework
  claimed: true
  verified: false
  evidence: >-
    The privacy policy asserts participation in the EU–U.S. Data Privacy Framework, the
    UK Extension, and the Swiss–U.S. Data Privacy Framework. This round could not
    independently confirm the listing — dataprivacyframework.gov renders its participant
    search client-side and its participantSearch API path returned 404 — so the claim is
    recorded as first-party and unverified.
certifications:
  found: []
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR certification is published
    anywhere on immunai.com. There is no trust center; trust.immunai.com and
    security.immunai.com do not resolve, and /trust, /security and /compliance all
    return 404.
