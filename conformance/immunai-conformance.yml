  applicable: false
  evidence: No OAuth authorization server; /.well-known/oauth-authorization-server returns 404.
- id: oidc
  conforms: false
  applicable: false
  evidence: /.well-known/openid-configuration returns 404 on every host.
- id: rfc9457-problem-details
